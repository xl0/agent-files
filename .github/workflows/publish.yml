name: Release

# `scripts/release.ts` pushes the tag; that push is the only trigger. Each pi
# package versions independently and is released under its own
# `<package>-v<x.y.z>` tag; the character classes keep prerelease suffixes
# (…-v1.2.3-rc.1) from triggering at all.
on:
  push:
    tags:
      - "pi-*-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency: npm-publish

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - run: npm install --global npm@12.0.2

      - name: Resolve the package from the tag
        run: |
          set -euo pipefail
          pkg="${GITHUB_REF_NAME%-v*}"
          version="${GITHUB_REF_NAME##*-v}"
          dir="pi/packages/${pkg}"
          test -f "${dir}/package.json" || { echo "::error::${dir}/package.json not found for tag $GITHUB_REF_NAME"; exit 1; }
          test "$version" = "$(node -p "require('./${dir}/package.json').version")" \
            || { echo "::error::${dir} version does not match $GITHUB_REF_NAME"; exit 1; }
          {
            echo "PKG_NAME=$(node -p "require('./${dir}/package.json').name")"
            echo "PKG_VERSION=${version}"
            echo "PKG_DIR=${dir}"
          } >> "$GITHUB_ENV"

      # The packages gitignore their lockfiles, so a plain install, not `npm ci`.
      - run: npm install --no-audit --no-fund
        working-directory: ${{ env.PKG_DIR }}

      - run: bun run check
        working-directory: ${{ env.PKG_DIR }}

      # Skipping an already-published version is what lets a half-failed release
      # be re-run. A registry error still fails: only a 404 means "not there".
      # Staged-but-unapproved versions are invisible to `npm view`; re-running
      # then fails on the stage publish itself (versions share one index).
      - name: Stage on npm
        working-directory: ${{ env.PKG_DIR }}
        run: |
          set -euo pipefail

          if seen="$(npm view "${PKG_NAME}@${PKG_VERSION}" version 2>&1)" && [ -n "$seen" ]; then
            echo "${PKG_NAME}@${PKG_VERSION} is already published (${seen}); skipping."
            exit 0
          fi
          case "$seen" in
            *E404*|*"404 Not Found"*) ;;
            *) echo "::error::could not query npm for ${PKG_NAME}@${PKG_VERSION}: ${seen}"; exit 1 ;;
          esac

          # Staged, not published: CI builds with OIDC provenance, but the
          # version only reaches the registry after a maintainer approves it
          # with 2FA (`npm stage approve` or npmjs.com).
          npm stage publish --access public --provenance --ignore-scripts

          echo "Staged ${PKG_NAME}@${PKG_VERSION}. Approve it with: npm stage approve"

  github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Gated on publish-npm, so a release is only ever visible for a version
      # whose verified build was at least staged on npm. Installability still
      # waits on the manual 2FA approval.
      - name: Create the GitHub Release
        run: |
          set -euo pipefail

          pkg="${GITHUB_REF_NAME%-v*}"
          version="${GITHUB_REF_NAME##*-v}"

          awk -v want="## [${version}]" '
            index($0, want) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' "pi/packages/${pkg}/CHANGELOG.md" > NOTES.md

          test -s NOTES.md || { echo "::error::no CHANGELOG.md section for $GITHUB_REF_NAME"; exit 1; }

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file NOTES.md
